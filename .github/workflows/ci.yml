name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 on 2026-11-21
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 on 2026-11-21
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: make build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 on 2026-11-21
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 on 2026-11-21
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8 on 2026-11-21
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 on 2026-11-21
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 on 2026-11-21
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  acceptance:
    # Black-box suite against the built binary (test/acceptance). A failure blocks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 on 2026-11-21
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 on 2026-11-21
        with:
          go-version-file: go.mod
      - run: make acceptance

  ui:
    # The admin app (web/, ADR 0019): types, tests, and the committed build
    # matches the source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 on 2026-11-21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 on 2026-11-21
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make ui-check
      # F14 R-05: no install scripts run (web/.npmrc), production
      # dependencies have no known vulnerability, and every package's
      # registry signature checks.
      - run: make ui-audit

  docs:
    # The documentation site (mkdocs.yml, docs/site/): a broken link or anchor,
    # or a page missing from the navigation, fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 on 2026-11-21
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7 on 2026-11-22
        with:
          python-version: "3.12"
      - run: make docs PYTHON=python
      # The image docs.privo.club runs: no inline script or style may be left
      # for the Content-Security-Policy (docs/externalize_inline_scripts.py).
      - run: docker build -f docs/Dockerfile -t privo-docs:ci .

  image:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 on 2026-11-21
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 on 2026-11-21
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 on 2026-11-21
        with:
          context: .
          push: false
          sbom: true
          provenance: true
          tags: privo:ci
