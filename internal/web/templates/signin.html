{{define "content"}}
<section class="card narrow">
  <h1>Sign in to Privo</h1>
  <p>Privo uses the account you sign in with to know who you are. Only people who were added as members of this Privo can sign in.</p>
{{range .Providers}}  <form method="post" action="{{.Action}}">
{{if $.ReturnTo}}    <input type="hidden" name="return_to" value="{{$.ReturnTo}}">
{{end}}    <button type="submit" class="primary">{{.Label}}</button>
  </form>
{{end}}</section>
{{end}}
