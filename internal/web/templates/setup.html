{{define "content"}}
<section class="card narrow">
  <h1>Set up Privo</h1>
  <p>This link makes the account you sign in with the <strong>owner</strong> of this Privo. It works once, and it expires at {{.Expires}}.</p>
  <p>Use the account you want to keep as the owner.</p>
{{range .Providers}}  <form method="post" action="{{.Action}}">
    <input type="hidden" name="setup_token" value="{{$.SetupToken}}">
    <button type="submit" class="primary">{{.Label}}</button>
  </form>
{{end}}</section>
{{end}}
